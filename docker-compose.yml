# Infraestrutura como código: aplicação + monitoramento (Prometheus e Grafana).
# Subir tudo:  docker compose up --build
services:
  app:
    build: .
    ports: ["8000:8000"]
    volumes: ["dados:/data"]
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [app]
  grafana:
    image: grafana/grafana:11.3.1
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - "./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"
    depends_on: [prometheus]
volumes:
  dados:
